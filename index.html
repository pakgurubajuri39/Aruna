
<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Remix Aruna - Asisten Virtual Pak Guru Luky</title>
    <meta name="description" content="Aruna adalah AI Assistant cerdas dengan pengetahuan universal. Sebagai asisten Pak Guru Luky, ia siap membantumu belajar apa saja, mulai dari matematika hingga tips kehidupan, dengan empati dan kecerdasan tinggi.">
    <meta property="og:title" content="Remix Aruna - Asisten Virtual Pak Guru Luky">
    <meta property="og:description" content="Aruna adalah AI Assistant cerdas dengan pengetahuan universal. Sebagai asisten Pak Guru Luky, ia siap membantumu belajar apa saja, mulai dari matematika hingga tips kehidupan, dengan empati dan kecerdasan tinggi.">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=JetBrains+Mono:wght@400;500&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: #0b0f17;
            margin: 0;
            overflow: hidden;
        }
        .font-display {
            font-family: 'Fraunces', serif;
        }
        .font-mono-num {
            font-family: 'JetBrains Mono', monospace;
            font-variant-numeric: tabular-nums;
        }
        .custom-scrollbar::-webkit-scrollbar {
            width: 6px;
        }
        .custom-scrollbar::-webkit-scrollbar-track {
            background: transparent;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb {
            background: #e2e8f0;
            border-radius: 10px;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover {
            background: #cbd5e1;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0px); opacity: 0.3; }
            50% { transform: translateY(-20px); opacity: 0.7; }
        }

        @keyframes breath {
            0%, 100% { transform: scale(1); filter: brightness(1); }
            50% { transform: scale(1.02); filter: brightness(1.05); }
        }

        @keyframes rotate-slow {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        .animate-float { animation: float 6s ease-in-out infinite; }
        .animate-breath { animation: breath 4s ease-in-out infinite; }
        
        .hologram-grid {
            background-image: linear-gradient(rgba(244, 63, 94, 0.05) 1px, transparent 1px),
                              linear-gradient(90deg, rgba(244, 63, 94, 0.05) 1px, transparent 1px);
            background-size: 30px 30px;
        }

        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }

        /* Transisi halus untuk elemen-elemen UI */
        .ui-transition {
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
    </style>
</head>
<body>
    <div id="root"></div>
<script type="module" src="/index.tsx"></script>
</body>
</html>
